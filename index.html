<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadString, getDownloadURL, deleteObject, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAjRi5z4wT74hgjEBn7bcEkqamBBmf45c0",
  authDomain: "gutman-pikuach.firebaseapp.com",
  projectId: "gutman-pikuach",
  storageBucket: "gutman-pikuach.firebasestorage.app",
  messagingSenderId: "143285603680",
  appId: "1:143285603680:web:53c562518c2dd19b46a205"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// ---- IMAGE UPLOAD TO FIREBASE STORAGE ----
async function uploadImages(reportId, defectIdx, imageType, base64Array) {
  const urls = [];
  for (let i = 0; i < base64Array.length; i++) {
    const src = base64Array[i];
    if (src.startsWith('http')) { urls.push(src); continue; } // already uploaded
    const path = `reports/${reportId}/defect_${defectIdx}_${imageType}_${i}_${Date.now()}`;
    const storageRef = ref(storage, path);
    const base64Data = src.split(',')[1];
    await uploadString(storageRef, base64Data, 'base64', { contentType: 'image/jpeg' });
    const url = await getDownloadURL(storageRef);
    urls.push(url);
  }
  return urls;
}

// ---- SAVE TO FIRESTORE ----
async function saveToCloud(report) {
  try {
    showToast('☁️ שומר לענן...');
    // Upload all images first
    for (let i = 0; i < (report.defects||[]).length; i++) {
      const d = report.defects[i];
      if (d.images?.some(s => !s.startsWith('http'))) {
        d.images = await uploadImages(report.id, i, 'defect', d.images);
      }
      if (d.planImages?.some(s => !s.startsWith('http'))) {
        d.planImages = await uploadImages(report.id, i, 'plan', d.planImages);
      }
    }
    // Save metadata to Firestore (no base64, only URLs)
    const reportData = { ...report };
    await setDoc(doc(db, 'reports', report.id), reportData);
    // Update local cache
    const idx = window.reports.findIndex(r => r.id === report.id);
    if (idx > -1) window.reports[idx] = reportData;
    else window.reports.unshift(reportData);
    localStorage.setItem('pikuach_reports', JSON.stringify(window.reports));
    showToast('✅ נשמר לענן בהצלחה');
  } catch(e) {
    console.error('Cloud save error:', e);
    showToast('⚠️ נשמר מקומית בלבד (בדוק חיבור)');
  }
}

// ---- LOAD FROM FIRESTORE ----
async function loadFromCloud() {
  try {
    showToast('☁️ טוען דוחות מהענן...');
    const q = query(collection(db, 'reports'), orderBy('updatedAt', 'desc'));
    const snap = await getDocs(q);
    const cloudReports = [];
    snap.forEach(d => cloudReports.push(d.data()));
    window.reports = cloudReports;
    localStorage.setItem('pikuach_reports', JSON.stringify(cloudReports));
    renderList();
    showToast('✅ ' + cloudReports.length + ' דוחות נטענו');
  } catch(e) {
    console.error('Cloud load error:', e);
    showToast('⚠️ עובד במצב לא מקוון');
    renderList();
  }
}

// ---- DELETE FROM FIRESTORE ----
async function deleteFromCloud(reportId) {
  try {
    await deleteDoc(doc(db, 'reports', reportId));
  } catch(e) { console.error('Delete error:', e); }
}

// Expose to global scope
window.saveToCloud = saveToCloud;
window.loadFromCloud = loadFromCloud;
window.deleteFromCloud = deleteFromCloud;

// Init: load from cloud on start
window.addEventListener('appReady', () => loadFromCloud());
</script>

// Simple password (can be changed)
const ACCESS_PASSWORD = "gutman2024";

let reports = JSON.parse(localStorage.getItem('pikuach_reports') || '[]');
let currentReportId = null;
let defectCount = 0;
const imageStore = {};
let currentUser = localStorage.getItem('pikuach_user') || null;

// ===================== LOGIN =====================
function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!name) { showLoginError('נא להזין שם'); return; }
  if (pass !== ACCESS_PASSWORD) { showLoginError('סיסמה שגויה'); return; }
  currentUser = name;
  localStorage.setItem('pikuach_user', name);
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('topbarUser').textContent = name;
  window.dispatchEvent(new Event('appReady'));
}

function doLogout() {
  localStorage.removeItem('pikuach_user');
  currentUser = null;
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginName').value = '';
  document.getElementById('loginPass').value = '';
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

// Check if already logged in
if (currentUser) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('topbarUser').textContent = currentUser;
  window.addEventListener('appReady', () => {});
  // Will trigger loadFromCloud once Firebase module loads
  window.addEventListener('load', () => {
    setTimeout(() => { if (window.loadFromCloud) window.loadFromCloud(); else renderList(); }, 800);
  });
}

// ===================== NAVIGATION =====================
function goToList() {
  document.getElementById('listScreen').classList.add('active');
  document.getElementById('formScreen').classList.remove('active');
  document.getElementById('backBtn').style.display = 'none';
  renderList();
  if (window.loadFromCloud) window.loadFromCloud();
}

function goToForm(isEdit) {
  document.getElementById('listScreen').classList.remove('active');
  document.getElementById('formScreen').classList.add('active');
  document.getElementById('backBtn').style.display = 'block';
}

function newReport() {
  currentReportId = null;
  clearForm();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f_date').value = today;
  document.getElementById('f_inspectDate').value = today;
  document.getElementById('f_inspector').value = currentUser || '';
  document.getElementById('formVersionBadge').textContent = 'גרסה 1';
  addDefect();
  goToForm(false);
}

function editReport(id) {
  currentReportId = id;
  const report = reports.find(r => r.id === id);
  if (!report) return;
  loadForm(report);
  goToForm(true);
}

// ===================== FORM =====================
function clearForm() {
  ['f_recipient','f_date','f_projectNum','f_address','f_inspectDate','f_inspector','f_elements','f_notes']
    .forEach(id => { const el = document.getElementById(id); if(el) el.value=''; });
  document.getElementById('defectsList').innerHTML = '';
  defectCount = 0;
  Object.keys(imageStore).forEach(k => { if(k.startsWith('d_')) delete imageStore[k]; });
}

function addDefect(data) {
  defectCount++;
  const idx = defectCount;
  const div = document.createElement('div');
  div.className = 'defect-row';
  div.id = 'defect_' + idx;
  div.innerHTML = `
    <div class="defect-row-num">ליקוי #${idx}</div>
    <button class="defect-remove" onclick="removeDefect(${idx})">✕</button>
    <div style="padding-top:14px">
      <div class="field-group">
        <label class="field-label">נושא</label>
        <input type="text" class="field-input" id="d_topic_${idx}" value="${esc(data?.topic||'')}" placeholder="נושא הליקוי...">
      </div>
      <div class="field-group">
        <label class="field-label">תיאור הליקוי</label>
        <textarea class="field-textarea" id="d_desc_${idx}" placeholder="תאר את הליקוי בפירוט...">${esc(data?.desc||'')}</textarea>
      </div>
      <div class="two-col">
        <div class="field-group">
          <label class="field-label">📷 תמונת הליקוי</label>
          <div class="img-upload-area" onclick="document.getElementById('d_img_${idx}').click()">
            <input type="file" accept="image/*" multiple id="d_img_${idx}" onchange="handleImages('d_imgs_${idx}',this)">
            <div class="upload-icon">📷</div><p>לחץ להעלאה</p>
          </div>
          <div class="img-previews" id="d_imgs_${idx}"></div>
        </div>
        <div class="field-group">
          <label class="field-label">📐 תמונה מהתכנית</label>
          <div class="img-upload-area" onclick="document.getElementById('d_plan_${idx}').click()">
            <input type="file" accept="image/*" multiple id="d_plan_${idx}" onchange="handleImages('d_plans_${idx}',this)">
            <div class="upload-icon">📐</div><p>לחץ להעלאה</p>
          </div>
          <div class="img-previews" id="d_plans_${idx}"></div>
        </div>
      </div>
    </div>`;
  document.getElementById('defectsList').appendChild(div);
  if (data?.images?.length) restoreImages('d_imgs_'+idx, data.images);
  if (data?.planImages?.length) restoreImages('d_plans_'+idx, data.planImages);
}

function removeDefect(idx) {
  const el = document.getElementById('defect_'+idx);
  if (el) el.remove();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function handleImages(storeKey, input) {
  if (!imageStore[storeKey]) imageStore[storeKey] = [];
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { imageStore[storeKey].push(e.target.result); renderImagePreviews(storeKey); };
    reader.readAsDataURL(file);
  });
}

function renderImagePreviews(storeKey) {
  const c = document.getElementById(storeKey);
  if (!c) return;
  c.innerHTML = (imageStore[storeKey]||[]).map((src,i) => `
    <div class="img-preview-wrap">
      <img src="${src}">
      <button class="img-remove" onclick="removeImage('${storeKey}',${i})">✕</button>
    </div>`).join('');
}

function removeImage(k, i) { imageStore[k]?.splice(i,1); renderImagePreviews(k); }

function restoreImages(k, imgs) {
  imageStore[k] = imgs;
  renderImagePreviews(k);
}

// ===================== SAVE / LOAD =====================
function getFormData() {
  const defects = [];
  document.querySelectorAll('.defect-row').forEach(row => {
    const idx = row.id.replace('defect_','');
    defects.push({
      topic: document.getElementById('d_topic_'+idx)?.value||'',
      desc: document.getElementById('d_desc_'+idx)?.value||'',
      images: imageStore['d_imgs_'+idx]||[],
      planImages: imageStore['d_plans_'+idx]||[]
    });
  });
  return {
    recipient: document.getElementById('f_recipient').value,
    date: document.getElementById('f_date').value,
    projectNum: document.getElementById('f_projectNum').value,
    address: document.getElementById('f_address').value,
    inspectDate: document.getElementById('f_inspectDate').value,
    inspector: document.getElementById('f_inspector').value,
    elements: document.getElementById('f_elements').value,
    notes: document.getElementById('f_notes').value,
    defects
  };
}

function loadForm(report) {
  clearForm();
  document.getElementById('f_recipient').value = report.recipient||'';
  document.getElementById('f_date').value = report.date||'';
  document.getElementById('f_projectNum').value = report.projectNum||'';
  document.getElementById('f_address').value = report.address||'';
  document.getElementById('f_inspectDate').value = report.inspectDate||'';
  document.getElementById('f_inspector').value = report.inspector||'';
  document.getElementById('f_elements').value = report.elements||'';
  document.getElementById('f_notes').value = report.notes||'';
  document.getElementById('formVersionBadge').textContent = 'גרסה '+(report.version||1);
  (report.defects||[]).forEach(d => addDefect(d));
  if (!report.defects?.length) addDefect();
}

async function saveReport(silent) {
  const data = getFormData();
  const now = new Date().toISOString();
  let reportToSave;
  if (currentReportId) {
    const idx = reports.findIndex(r => r.id === currentReportId);
    if (idx > -1) {
      const newVer = (reports[idx].version||1) + 1;
      reportToSave = { ...reports[idx], ...data, updatedAt: now, version: newVer, lastEditedBy: currentUser };
      reports[idx] = reportToSave;
    }
  } else {
    const id = 'r_' + Date.now();
    currentReportId = id;
    reportToSave = { id, createdAt: now, updatedAt: now, version: 1, createdBy: currentUser, lastEditedBy: currentUser, ...data };
    reports.unshift(reportToSave);
  }
  const ver = reportToSave.version || 1;
  document.getElementById('formVersionBadge').textContent = 'גרסה ' + ver;
  localStorage.setItem('pikuach_reports', JSON.stringify(reports));
  window.reports = reports;
  if (!silent) showToast('💾 שומר...');
  if (window.saveToCloud) await window.saveToCloud(reportToSave);
}

async function deleteReport(id) {
  if (!confirm('האם למחוק דוח זה?')) return;
  reports = reports.filter(r => r.id !== id);
  window.reports = reports;
  localStorage.setItem('pikuach_reports', JSON.stringify(reports));
  if (window.deleteFromCloud) await window.deleteFromCloud(id);
  renderList();
  showToast('🗑 הדוח נמחק');
}

// ===================== LIST =====================
function renderList() {
  const el = document.getElementById('reportsList');
  if (!reports.length) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>אין דוחות עדיין<br>לחץ על "דוח חדש" להתחיל</p></div>`;
    return;
  }
  el.innerHTML = reports.map(r => {
    const d = r.inspectDate ? new Date(r.inspectDate).toLocaleDateString('he-IL') : '-';
    const defCount = (r.defects||[]).length;
    const ver = r.version||1;
    const author = r.lastEditedBy || r.createdBy || '';
    return `
      <div class="report-card">
        <div class="rc-header">
          <div class="rc-title">${r.address||'פרויקט ללא כתובת'}</div>
          <div class="rc-badges">
            <div class="rc-version">גרסה ${ver}</div>
            <div class="rc-date">${d}</div>
          </div>
        </div>
        <div class="rc-meta">
          ${r.projectNum?'מס׳ '+r.projectNum+' &bull; ':''}
          ${r.inspector?r.inspector+' &bull; ':''}
          ${defCount} ליקויים
          ${author ? ' &bull; ' + author : ''}
        </div>
        <div class="rc-actions">
          <button class="btn-small btn-edit" onclick="editReport('${r.id}')">✏️ עריכה</button>
          <button class="btn-small btn-pdf" onclick="generateAndDownloadPDF('${r.id}')">📄 PDF</button>
          <button class="btn-small btn-delete" onclick="deleteReport('${r.id}')">🗑</button>
        </div>
      </div>`;
  }).join('');
}

// ===================== PDF =====================
function buildPDFHTML(report) {
  const fmtDate = s => s ? new Date(s).toLocaleDateString('he-IL') : '-';
  const ver = report.version||1;
  let defectsHtml = '';
  (report.defects||[]).forEach((d,i) => {
    const allImgs = [
      ...(d.images||[]).map(s=>({src:s,lbl:'תמונת ליקוי'})),
      ...(d.planImages||[]).map(s=>({src:s,lbl:'תמונה מהתכנית'}))
    ];
    const imgsHtml = allImgs.length
      ? '<div class="pdf-images-row">' + allImgs.map(img=>`<div class="pdf-img-wrap"><img src="${img.src}" crossorigin="anonymous"><div class="pdf-img-label">${img.lbl}</div></div>`).join('') + '</div>'
      : '';
    defectsHtml += `<div class="pdf-defect-block">
      <div class="pdf-defect-header">ליקוי #${i+1}${d.topic?' — '+d.topic:''}</div>
      <div class="pdf-defect-body">${d.desc?`<p>${d.desc.replace(/\n/g,'<br>')}</p>`:''}${imgsHtml}</div>
    </div>`;
  });
  const notesHtml = report.notes
    ? `<div class="pdf-section-header">הערות מסכמות</div><div class="pdf-notes-box">${report.notes.replace(/\n/g,'<br>')}</div>`
    : '';
  const editedBy = report.lastEditedBy ? `ערך לאחרונה: ${report.lastEditedBy}` : '';
  return `<div class="pdf-page">
    <div class="pdf-header">
      <img src="${LOGO_SRC}" alt="לוגו">
      <div class="pdf-header-info">גוטמן יעקב מהנדסים בע"מ<br>רח' גרניט 5, פ"ת<br>Tel: 03-5790770 | Fax: 03-5790771<br>office@gutmaneng.co.il</div>
    </div>
    <div class="pdf-title">דוח פיקוח עליון באתר</div>
    <div class="pdf-version">גרסה ${ver}</div>
    <div class="pdf-author">${editedBy}</div>
    <table class="pdf-info-table">
      <tr><td class="lbl">לכבוד</td><td>${report.recipient||'-'}</td><td class="lbl">תאריך הדוח</td><td>${fmtDate(report.date)}</td></tr>
      <tr><td class="lbl">כתובת הפרויקט</td><td colspan="3">${report.address||'-'}</td></tr>
      <tr><td class="lbl">מס׳ פרויקט</td><td>${report.projectNum||'-'}</td><td class="lbl">תאריך הבדיקה</td><td>${fmtDate(report.inspectDate)}</td></tr>
      <tr><td class="lbl">שם הבודק</td><td>${report.inspector||'-'}</td><td class="lbl">אלמנטים נבדקים</td><td>${report.elements||'-'}</td></tr>
    </table>
    ${(report.defects||[]).length?'<div class="pdf-section-header">ממצאים וליקויים</div>':''}
    ${defectsHtml}
    ${notesHtml}
    <div class="pdf-footer">גוטמן יעקב מהנדסים בע"מ | גרסה ${ver} | ${new Date().toLocaleDateString('he-IL')}</div>
  </div>`;
}

async function generateAndDownloadPDF(reportId, returnBlob) {
  const report = reports.find(r => r.id === reportId);
  if (!report) return null;
  showToast('⏳ מייצר PDF...');
  const area = document.getElementById('pdfRenderArea');
  area.innerHTML = buildPDFHTML(report);
  await new Promise(res => {
    const imgs = area.querySelectorAll('img');
    if (!imgs.length) return res();
    let loaded = 0;
    imgs.forEach(img => {
      if (img.complete) { loaded++; if(loaded===imgs.length) res(); }
      else { img.onload = img.onerror = () => { loaded++; if(loaded===imgs.length) res(); }; }
    });
    setTimeout(res, 4000);
  });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
  const canvas = await html2canvas(area.querySelector('.pdf-page'), {
    scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', width: 794, logging: false
  });
  const imgData = canvas.toDataURL('image/jpeg', 0.92);
  const pageW=210, pageH=297;
  const imgRatio = canvas.height / canvas.width;
  const renderedH = pageW * imgRatio;
  if (renderedH <= pageH) {
    pdf.addImage(imgData,'JPEG',0,0,pageW,renderedH);
  } else {
    const sliceHpx = Math.floor(canvas.width*(pageH/pageW));
    let offsetY=0, first=true;
    while (offsetY < canvas.height) {
      if (!first) pdf.addPage();
      first=false;
      const sc = document.createElement('canvas');
      sc.width=canvas.width; sc.height=sliceHpx;
      const ctx=sc.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,sc.width,sc.height);
      ctx.drawImage(canvas,0,-offsetY);
      pdf.addImage(sc.toDataURL('image/jpeg',0.92),'JPEG',0,0,pageW,pageH);
      offsetY+=Math.min(sliceHpx, canvas.height-offsetY);
    }
  }
  area.innerHTML='';
  if (returnBlob) return pdf.output('blob');
  const addr=(report.address||'דוח').replace(/[^\u0590-\u05FFa-zA-Z0-9]/g,'_');
  const dateStr=(report.inspectDate||'').replace(/-/g,'');
  const ver=report.version||1;
  pdf.save(`דוח_פיקוח_${addr}_v${ver}_${dateStr}.pdf`);
  showToast('✅ PDF הורד בהצלחה');
  return null;
}

async function downloadPDF() {
  await saveReport(true);
  await generateAndDownloadPDF(currentReportId);
}

// ===================== EMAIL =====================
function openEmailModal() {
  const r = currentReportId ? reports.find(x=>x.id===currentReportId) : null;
  document.getElementById('emailSubject').value = 'דוח פיקוח עליון - '+(r?.address||'פרויקט');
  document.getElementById('emailModal').classList.add('open');
}
function closeEmailModal() { document.getElementById('emailModal').classList.remove('open'); }
async function sendEmail() {
  const email=document.getElementById('emailAddr').value;
  const subject=document.getElementById('emailSubject').value;
  if (!email) { showToast('⚠️ נא להזין כתובת מייל'); return; }
  closeEmailModal();
  await saveReport(true);
  await generateAndDownloadPDF(currentReportId);
  const body='שלום,\n\nמצורף דוח פיקוח עליון.\nהקובץ הורד למכשירך - יש לצרפו למייל.\n\nגוטמן יעקב מהנדסים בע"מ';
  window.location.href='mailto:'+email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  showToast('📧 PDF נשמר — צרף למייל שנפתח');
}

// ===================== UTILS =====================
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

window.reports = reports;

if (currentUser) {
  window.addEventListener('load', () => {
    setTimeout(() => window.dispatchEvent(new Event('appReady')), 600);
  });
}

renderList();
</script>
